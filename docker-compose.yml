services:
  portfolio:
    build:
      context: .
      args:
        VITE_APERO_API_URL: ${VITE_APERO_API_URL}
        VITE_APERO_API_KEY: ${VITE_APERO_API_KEY}
        VITE_APERO_PROJECT_ID: ${VITE_APERO_PROJECT_ID}
    restart: unless-stopped
    # Reached only via the shared Caddy reverse proxy (see
    # ~/Dev/server-infra) — no host port published. Uncomment for
    # local debugging without the proxy in front:
    # ports:
    #   - "8080:80"
    networks:
      - webproxy

networks:
  webproxy:
    external: true
