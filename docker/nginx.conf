server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
        image/svg+xml application/xml text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets — cache forever, filenames change on every deploy
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must always be revalidated so a new deploy is picked up
    # immediately instead of being served from a visitor's cache
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: serve real files/directories as-is, otherwise hand
    # everything to index.html (covers /styleguide and any future routes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
